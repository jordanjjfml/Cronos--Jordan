<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Valor do Dia</title>
</head>

<body>
    <main class="container">
        <section class="card">
            <p class="eyebrow">Cotação atualizada do dia</p>
            <h1 id="display">Carregando...</h1>

            <div class="linha">
                <label for="valor">Valor</label>
                <input id="valor" type="number" min="0" step="0.01" value="1" />
            </div>

            <div class="linha">
                <label for="moeda">Moeda</label>
                <select id="moeda">
                    <option value="BRL">Real (BRL)</option>
                    <option value="USD">Dólar (USD)</option>
                    <option value="EUR">Euro (EUR)</option>
                    <option value="GBP">Libra (GBP)</option>
                    <option value="JPY">Iene (JPY)</option>
                    <option value="CAD">Dólar canadense (CAD)</option>
                    <option value="AUD">Dólar australiano (AUD)</option>
                    <option value="CHF">Franco suíço (CHF)</option>
                </select>
            </div>

            <button id="buscar" type="button">Pesquisar</button>

            <div class="resultado">
                <p id="status">Buscando cotações...</p>
                <h2 id="resultado">R$ 0,00</h2>
                <p id="taxa">1 USD = 0,00 BRL</p>
                <p class="atualizacao">Atualizado em: <span id="ultima-atualizacao">--</span></p>
            </div>

            <ul id="taxas" class="taxas"></ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
